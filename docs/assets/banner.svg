<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Outreach Agent: cold emails where every fact has a source">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)" opacity="0.55"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="72" y="62" width="10" height="10" rx="2" fill="url(#acc)"/>
    <text x="94" y="72" font-size="15" font-weight="700" letter-spacing="3" fill="#94a3b8">OUTREACH AGENT</text>

    <text x="72" y="150" font-size="58" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">Cold emails where every</text>
    <text x="72" y="218" font-size="58" font-weight="800" letter-spacing="-1.5"><tspan fill="#f8fafc">fact has a </tspan><tspan fill="url(#acc)">source.</tspan></text>

    <text x="72" y="268" font-size="21" fill="#cbd5e1">An agent that researches a company, writes the email, and proves each claim</text>
    <text x="72" y="298" font-size="21" fill="#cbd5e1">with a URL and an exact quote. A human approves every send.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" text-anchor="middle">
    <g fill="#0f1a2e" stroke="#334155">
      <rect x="72" y="336" width="104" height="34" rx="17"/>
      <rect x="198" y="336" width="104" height="34" rx="17"/>
      <rect x="450" y="336" width="124" height="34" rx="17"/>
      <rect x="596" y="336" width="96" height="34" rx="17"/>
      <rect x="866" y="336" width="150" height="34" rx="17"/>
      <rect x="1038" y="336" width="84" height="34" rx="17"/>
    </g>
    <rect x="324" y="336" width="104" height="34" rx="17" fill="#0c2a24" stroke="#34d399"/>
    <rect x="714" y="336" width="130" height="34" rx="17" fill="#0c2a24" stroke="#34d399"/>
    <g fill="#cbd5e1">
      <text x="124" y="358">validate</text>
      <text x="250" y="358">score</text>
      <text x="512" y="358">pain points</text>
      <text x="644" y="358">writer</text>
      <text x="941" y="358">human review</text>
      <text x="1080" y="358">send</text>
    </g>
    <g fill="#6ee7b7" font-weight="700">
      <text x="376" y="358">research</text>
      <text x="779" y="358">verifier</text>
    </g>
    <g stroke="#475569" stroke-width="1.5">
      <path d="M178 353h18M304 353h18M430 353h18M576 353h18M694 353h18M846 353h18M1018 353h18"/>
    </g>
  </g>
</svg>
